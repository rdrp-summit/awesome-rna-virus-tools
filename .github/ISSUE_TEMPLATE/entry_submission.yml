name: Suggest a catalog entry
description: Suggest software, a database, or literature for maintainer review
title: "[new entry] "
labels: ["new-entry"]
body:
  - type: markdown
    attributes:
      value: "A pull request adding a JSON file to `entries/` is preferred. Use this form when you only have a suggestion."
  - type: dropdown
    id: type
    attributes:
      label: Entry type
      options:
        - Tool or software
        - Database or resource
        - Literature
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name or title
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Public URL
      placeholder: https://
    validations:
      required: true
  - type: input
    id: doi
    attributes:
      label: DOI
      description: Include the associated DOI when one exists.
  - type: textarea
    id: relevance
    attributes:
      label: RNA virus relevance
      description: Briefly explain what the entry does and why it belongs in this catalog.
    validations:
      required: true
